name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed distribution
        run: git diff --exit-code -- main.js THIRD_PARTY_NOTICES.txt
      - run: npx playwright install --with-deps chromium
      - run: npm test
  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: word-count-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find an unpublished tagged bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'No matching version tag; skipping release.'
            exit 0
          fi
          if ! git diff --quiet "$RELEASE_TAG" HEAD -- manifest.json main.js styles.css; then
            echo 'Current bundle differs from the tag; skipping release.'
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
            exit 0
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Publish installable release
        if: steps.bundle.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bundle.outputs.tag }}
        run: gh release create "$RELEASE_TAG" manifest.json main.js styles.css --verify-tag --title "$RELEASE_TAG" --generate-notes
